<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <meta name="apple-mobile-web-app-capable" content="yes" />

    <title>Tap to Place AR</title>

    <script crossorigin="anonymous" src="./external/scripts/8frame-1.5.0.min.js"></script>
    <script crossorigin="anonymous" src="./external/xrextras/xrextras.js"></script>
    <script crossorigin="anonymous" src="./external/landing-page/landing-page.js"></script>
    <script crossorigin="anonymous" src="./external/xr/xr.js"
            async="true" data-preload-chunks="slam"></script>

    <script crossorigin="anonymous"
      src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v6.1.1/dist/aframe-extras.min.js">
    </script>
    <script src="https://cdn.jsdelivr.net/npm/fflate@0.7.4/umd/index.min.js"></script>

    <link href="https://fonts.googleapis.com/earlyaccess/notosansjp.css" />

    <meta name="8thwall:renderer" content="aframe:1.5.0" />
    <meta name="8thwall:package"  content="@8thwall.xrextras" />
    <meta name="8thwall:package"  content="@8thwall.landing-page" />
  </head>

  <body>
    <script src="bundle.js"></script>

    <a-scene
      tap-place
      landing-page
      xrextras-loading
      xrextras-runtime-error
      gltf-model="dracoDecoderPath: https://cdn.8thwall.com/web/aframe/draco-decoder/"
      renderer="
        colorManagement: true;
        antialias: false;
        powerPreference: high-performance"
      shadow
      xrweb="allowedDevices: any"
    >

      <a-assets>
        <a-asset-item id="hider-wall-panel" src="assets/models/hidewall.glb"></a-asset-item>
      </a-assets>

      <a-camera
        id="camera"
        position="0 1.5 0"
        raycaster="objects: .cantap"
        cursor="fuse: false; rayOrigin: mouse;">
      </a-camera>

      <a-entity scene-lighting-component></a-entity>

      <!--
        Shadow / tap-detection ground.
        Position y=-1 so the top face sits at y=0 (world-tracking ground level).
      -->
      <a-box
        id="ground"
        class="cantap"
        scale="1000 2 1000"
        position="0 -1 0"
        material="shader: shadow; transparent: true; opacity: 0.4"
        shadow="cast: false">
      </a-box>

      <!-- Hider wall: pre-loaded, invisible until player4ds-loaded fires -->
      <a-entity
        id="hidewall-panel"
        gltf-model="#hider-wall-panel"
        visible="false">
      </a-entity>

      <!--
        4DS player: url starts empty so the component initialises without
        fetching. tap-place sets url on first tap → triggers load4ds().
      -->
      <a-entity
        id="player4ds-panel"
        player4ds-component="
          url      : ;
          isPlaying: false;
          isVisible: false;
          isMute   : false;
          isLoop   : false;">
      </a-entity>

    </a-scene>

    <div class="over">
      <span id="promptText">Tap To Place</span>
      <span id="hintText">Drag to move &nbsp;&middot;&nbsp; Pinch to resize</span>
    </div>

  </body>
</html>
